# Configurazione del progetto Cloudflare Pages
name = "soullink"
pages_build_output_dir = "public"
compatibility_date = "2026-10-01"

[[d1_databases]]
binding = "DB"
database_name = "soullink"
# Sostituisci con l'ID stampato da:  npx wrangler d1 create soullink
database_id = "METTI-QUI-L-ID-DEL-DATABASE"
