# Crea SoulLinkTracker.exe su Windows a ogni modifica.
# - L'exe si scarica da: Actions -> ultima esecuzione -> Artifacts -> SoulLinkTracker
# - Se crei un tag che inizia con "v" (es. v3.0.0) viene pubblicato anche come Release.
name: Crea exe

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installa le dipendenze
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements.txt pyinstaller

      - name: Crea l'exe
        run: >
          pyinstaller --noconfirm --onefile --windowed
          --name SoulLinkTracker
          --icon app/risorse/icona.ico
          --add-data "app/risorse;risorse"
          --paths app
          app/main.py

      - uses: actions/upload-artifact@v4
        with:
          name: SoulLinkTracker
          path: dist/SoulLinkTracker.exe

      - name: Pubblica la release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/SoulLinkTracker.exe
