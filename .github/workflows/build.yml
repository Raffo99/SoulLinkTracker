# Crea SoulLinkTracker.exe su Windows a ogni modifica.
# - L'exe si scarica sempre da: Actions -> ultima esecuzione -> Artifacts -> SoulLinkTracker
# - Se la versione in app/sl/__init__.py (VERSIONE = "...") è nuova, pubblica da sola la Release vX.Y.Z
#   con l'exe e con le novità scritte in NOVITA.md: le app degli amici la trovano e si aggiornano.
name: Crea exe

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installa le dipendenze
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements.txt pyinstaller

      - name: Crea l'exe
        run: >
          pyinstaller --noconfirm --onefile --windowed
          --name SoulLinkTracker
          --icon app/risorse/icona.ico
          --add-data "app/risorse;risorse"
          --paths app
          --collect-submodules lupa
          --collect-submodules pycaw
          --hidden-import comtypes.stream
          --collect-submodules aiortc
          --collect-submodules aioice
          --collect-submodules websockets
          --collect-submodules paho
          --collect-submodules sl
          app/main.py

      - name: Controlla che l'exe contenga tutto
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\SoulLinkTracker.exe -ArgumentList "--prova-moduli" -Wait -PassThru
          Get-Content prova_moduli.txt
          if ($p.ExitCode -ne 0) { exit 1 }

      - uses: actions/upload-artifact@v4
        with:
          name: SoulLinkTracker
          path: dist/SoulLinkTracker.exe

      - name: Leggi la versione
        id: versione
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER=$(python -c "import re;print(re.search(r'VERSIONE = \"(.+?)\"', open('app/sl/__init__.py', encoding='utf-8').read()).group(1))")
          echo "versione=$VER" >> "$GITHUB_OUTPUT"
          if gh release view "v$VER" > /dev/null 2>&1; then
            echo "nuova=no" >> "$GITHUB_OUTPUT"
            echo "La release v$VER esiste già: niente da pubblicare."
          else
            echo "nuova=si" >> "$GITHUB_OUTPUT"
            echo "Versione nuova: pubblico la release v$VER."
          fi

      - name: Pubblica la release
        if: steps.versione.outputs.nuova == 'si'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.versione.outputs.versione }}
          name: Soul Link Tracker ${{ steps.versione.outputs.versione }}
          body_path: NOVITA.md
          files: dist/SoulLinkTracker.exe
          make_latest: true
